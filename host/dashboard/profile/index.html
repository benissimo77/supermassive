<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - SuperMassive</title>
    <link rel="stylesheet" href="/css/dashboard.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script type="module" src="/modules/dashboard.min.js" defer></script>
    <script type="module" src="/modules/dashboard-profile.min.js" defer></script>
    
</head>
<body>
    <nav id="sidebar"></nav>

    <main>
        <div class="page-header">
            <h1>User Profile</h1>
            <p>View and update your profile information.</p>
        </div>

        <div id="profile-container" class="profile-card">
            <div class="empty-state">Loading profile...</div>
        </div>
    </main>

    <template id="profile-view-template">
        <div class="profile-item">
            <label>Joined</label>
            <div class="value profile-joined"></div>
        </div>
        <div class="profile-item">
            <label>Role</label>
            <div class="value profile-role" style="text-transform: capitalize;"></div>
        </div>
        <div class="profile-item">
            <label>Avatar</label>
            <img class="avatar-preview profile-avatar-img">
        </div>
        <div class="profile-item">
            <label>Display Name</label>
            <div class="value profile-displayname"></div>
        </div>
        <div class="profile-item">
            <label>Email</label>
            <div class="value profile-email"></div>
        </div>
        <div class="profile-actions">
            <button class="btn btn-edit btn-toggle-edit">
                <i class="fa-solid fa-pen-to-square"></i> Edit Profile
            </button>
        </div>
        <div class="status-msg"></div>
    </template>

    <template id="profile-edit-template">
        <div class="profile-item">
            <label>Avatar</label>
            <img class="avatar-preview current-avatar-preview">
            <div class="avatar-selection-grid"></div>
        </div>
        <div class="profile-item">
            <label>Display Name (Max 15 chars)</label>
            <input type="text" class="edit-displayname edit-input" maxlength="15">
        </div>
        <div class="profile-actions">
            <button class="btn btn-save btn-save-profile">Save Changes</button>
            <button class="btn btn-edit btn-cancel-edit">Cancel</button>
        </div>
        <div class="status-msg"></div>
    </template>

    <template id="avatar-option-template">
        <img class="avatar-option">
    </template>

    <style>
        .profile-card {
            background: var(--clr-surface);
            border: 1px solid var(--clr-border);
            border-radius: var(--radius-lg);
            padding: var(--space-xl);
            max-width: 900px;
            margin-top: var(--space-lg);
        }

        .profile-item {
            margin-bottom: var(--space-lg);
            display: flex;
            flex-direction: column;
            gap: var(--space-xs);
        }

        .profile-item label {
            color: var(--clr-text-label);
            font-size: 0.85rem;
            text-transform: uppercase;
            font-weight: 700;
        }

        .profile-item .value {
            font-size: 1.1rem;
            color: var(--clr-text);
        }

        .avatar-preview {
            width: 80px;
            height: 120px;
            object-fit: contain;
            margin-bottom: var(--space-sm);
        }

        .avatar-selection-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 10px;
            margin-top: var(--space-sm);
            max-height: 320px;
            overflow-y: auto;
            padding: 8px;
            border: 1px solid var(--clr-border);
            border-radius: var(--radius-md);
            background: var(--clr-bg);
        }

        .avatar-option {
            width: 80px;
            height: 120px;
            cursor: pointer;
            border: 3px solid transparent;
            transition: all 0.2s ease;
            object-fit: contain;
            display: block;
        }

        .avatar-option:hover {
            transform: scale(1.05);
            border-color: var(--clr-primary);
        }

        .avatar-option.selected {
            border-color: var(--clr-accent);
            background: rgba(255, 140, 0, 0.1);
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(255, 140, 0, 0.3);
        }

        .edit-input {
            width: 90%;
            padding: var(--space-sm) var(--space-md);
            background: var(--clr-input-bg);
            border: 1px solid var(--clr-input-border);
            border-radius: var(--radius-sm);
            color: var(--clr-text);
            font-family: inherit;
        }

        .profile-actions {
            margin-top: var(--space-xl);
            display: flex;
            gap: var(--space-md);
        }

        .btn-save {
            background-color: var(--clr-primary);
            color: white;
            font-weight: 700;
        }

        .btn-edit {
            background-color: var(--clr-surface-alt);
            color: var(--clr-text);
            border: 1px solid var(--clr-border);
        }

        .status-msg {
            margin-top: var(--space-md);
            font-size: 0.9rem;
            padding: var(--space-sm);
            border-radius: var(--radius-sm);
            display: none;
        }

        .status-success {
            display: block;
            background: rgba(16, 185, 129, 0.1);
            color: var(--clr-primary);
        }

        .status-error {
            display: block;
            background: rgba(181, 60, 56, 0.1);
            color: #ff6b6b;
        }
    </style>

</body>
</html>
