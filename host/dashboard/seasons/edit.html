<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Season Details - SuperMassive</title>
    <link rel="stylesheet" href="/css/dashboard.css">
    <link rel="stylesheet" href="/css/quizbuilder.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script type="module" src="/modules/dashboard.min.js" defer></script>
    <script type="module" src="/modules/dashboard-seasonedit.min.js" defer></script>

    <style>
        /* Episode cards — purple/violet accent, complementary to the season amber */
        .episode-card {
            margin-top: 0.75rem;
            border-left: 3px solid rgb(139, 92, 246) !important;
        }
        .episode-card > .card-header {
            background: rgba(139, 92, 246, 0.2);
        }
        /* Add Episode button matches episode colour */
        .btn-episode {
            background-color: rgba(139, 92, 246, 0.2) !important;
            border: 1px solid rgba(139, 92, 246, 0.3) !important;
            color: var(--clr-text) !important;
        }
        /* Calendar picker icon — visible in dark mode */
        input[type="date"]::-webkit-calendar-picker-indicator,
        input[type="time"]::-webkit-calendar-picker-indicator {
            filter: brightness(0) invert(0.65);
            cursor: pointer;
        }
        /* Concise width for date and time pickers so the icons are close to the text values */
        input[type="date"] {
            width: 150px;
        }
        input[type="time"] {
            width: 110px;
        }

        .public-badge {
            padding: 0.2rem 0.8rem;
            background: rgba(0, 200, 100, 0.15);
            color: #00c864;
            border-radius: 999px;
            font-size: 0.8rem;
            font-weight: 700;
        }
        .empty-state {
            padding: 4rem;
            text-align: center;
            background: var(--clr-surface);
            border: 2px dashed var(--clr-border);
            border-radius: 20px;
            color: var(--clr-text-muted);
        }
    </style>
</head>

<body class="dashboard-body">
    <div id="sidebar" class="sidebar"></div>

    <main class="main-content">
        <div class="editor-header">
            <div class="flex items-center gap-md">
                <a href="/host/dashboard/seasons/" class="btn btn-ghost">
                    <i class="fa-solid fa-arrow-left"></i>
                    Back
                </a>
                <h1>Season Editor</h1>
            </div>
            <div class="flex gap-md">
                <button id="save-season-btn" class="btn btn-primary btn-save-all">
                    <i class="fa-solid fa-floppy-disk"></i>
                    Save Season
                </button>
            </div>
        </div>

        <!-- Season Metadata (inline editable) -->
        <details class="card quiz-card" open id="season-details">
            <summary class="card-header">
                <div class="flex items-center gap-sm">
                    <span class="header-quiz-label">Season:</span>
                    <span id="header-season-name" style="font-weight: 600;"></span>
                </div>
            </summary>
            <div class="card-body">
                <div class="form-two-column">
                    <div class="form-left-column">
                        <div class="form-grid">
                            <label for="season-name-input">Name</label>
                            <input type="text" id="season-name-input" placeholder="Season name">

                            <label for="season-series-input">Series</label>
                            <input type="text" id="season-series-input" placeholder="e.g. Pub Quiz @ Home (optional)">

                            <label for="season-desc-input">Description</label>
                            <textarea id="season-desc-input" rows="3" placeholder="What's this season about? (optional)"></textarea>
                        </div>
                    </div>
                    <div class="form-right-column">
                        <div class="form-grid">
                            <label for="season-start-input">Start Date</label>
                            <input type="date" id="season-start-input">

                            <label for="season-end-input">End Date</label>
                            <input type="date" id="season-end-input">

                            <label for="season-default-time-input">Default Time</label>
                            <input type="time" id="season-default-time-input" step="300">

                            <label for="season-public-input">Public</label>
                            <div style="display: flex; align-items: center;">
                                <input type="checkbox" id="season-public-input" style="width: auto; accent-color: var(--clr-accent); width: 1.1rem; height: 1.1rem;">
                            </div>
                        </div>
                    </div>
                </div>

                <div id="episode-list" class="mt-md"></div>

                <div class="flex justify-between mt-md">
                    <button class="btn btn-episode" onclick="addEpisodeInline()">
                        <i class="fa-solid fa-plus"></i>
                        Add Episode
                    </button>
                    <button class="btn btn-primary btn-save-all" onclick="saveAll()">
                        <i class="fa-solid fa-floppy-disk"></i>
                        Save Season
                    </button>
                </div>
            </div>
        </details>
    </main>

    <!-- <script type="module">
        import { initDashboardSeasonEdit } from '/modules/dashboard-seasonedit.min.js';
		initDashboardSeasonEdit();
		console.log('Dashboard season edit module initialized');
    </script> -->
    
</body>
</html>
