<!DOCTYPE html>
<html lang="en">

<!-- SEASONS -->
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Seasons - SuperMassive</title>
	<link rel="stylesheet" href="/css/dashboard.css">
	<link rel="stylesheet" href="/css/quizbuilder.css">
	<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
	<script type="module" src="/modules/dashboard.min.js" defer></script>
	<script type="module" src="/modules/dashboard-seasons.min.js" defer></script>

</head>

<body>
	<nav id="sidebar"></nav>

	<main>
		<div class="page-header">
			<h1>Seasons</h1>
			<div class="flex gap-md">
				<button id="new-season-btn" class="btn btn-accent">
					<i class="fa-solid fa-plus"></i>
					New Season
				</button>
			</div>
		</div>

		<details class="card" open>
			<summary class="card-header">
				<h2>My Seasons</h2>
			</summary>
			<div class="card-body">
				<section id="season-list" class="season-grid">
					<div class="empty-state">Loading your seasons...</div>
				</section>
			</div>
		</details>

		<details class="card" open style="margin-top: 2.5rem;">
			<summary class="card-header">
				<h2>Public Seasons</h2>
			</summary>
			<div class="card-body">
				<section id="public-season-list" class="season-grid">
					<div class="empty-state">Loading public seasons...</div>
				</section>
			</div>
		</details>
	</main>

	<template id="season-card-template">
		<div class="card season-card">
			<button class="delete-season-item season-delete-btn btn btn-sm btn-danger" hidden onclick="event.stopPropagation()" title="Delete season">
				<i class="fas fa-trash"></i>
			</button>
			<div class="card-body">
				<h3 class="season-name"></h3>
				<p class="season-description" hidden></p>
				<div class="season-meta">
					<span><i class="fa-solid fa-film" style="margin-right:3px; opacity:0.5;"></i><span class="season-episode-count"></span></span>
					<span class="public-badge" hidden>Public</span>
				</div>
			</div>
		</div>
	</template>

</body>

</html>
